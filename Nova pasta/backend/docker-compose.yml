services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao-contratos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: contratos
      POSTGRES_PASSWORD: contratos
      POSTGRES_DB: gestao_contratos
    ports:
      - "5433:5432"
    volumes:
      - gestao_contratos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contratos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestao-contratos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://contratos:contratos@postgres:5432/gestao_contratos
      MIGRATION_DATABASE_URL: postgresql://contratos:contratos@postgres:5432/gestao_contratos
      ALLOW_TEST_DB_MIGRATIONS: "true"
      CORS_ORIGINS: http://localhost:3000
      DEV_AUTH_ENABLED: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

volumes:
  gestao_contratos_pgdata:
